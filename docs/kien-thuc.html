<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ kiến thức · realworld-api</title>
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --surface-2:#f3f1ec; --text:#1d1c1a; --muted:#6b6862;
  --line:#e4e0d8; --accent:#c2410c; --accent-soft:#fdeee5; --ok:#15803d; --ok-soft:#e7f5ec;
  --code-bg:#f5f3ee; --code-text:#2b2925; --warn:#a16207; --warn-soft:#fff7e0;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151412; --surface:#1d1c19; --surface-2:#25231f; --text:#ece9e2; --muted:#a29e95;
    --line:#34312b; --accent:#fb923c; --accent-soft:#3a2416; --ok:#4ade80; --ok-soft:#173022;
    --code-bg:#211f1b; --code-text:#e6e2d9; --warn:#facc15; --warn-soft:#332a12;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 var(--sans)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
code{font:13px var(--mono);background:var(--code-bg);color:var(--code-text);padding:1px 5px;border-radius:4px}
pre{font:13px/1.55 var(--mono);background:var(--code-bg);color:var(--code-text);padding:12px 14px;border-radius:8px;overflow-x:auto;border:1px solid var(--line);margin:10px 0}
pre code{background:none;padding:0}
.c{color:var(--muted)}
.wrap{max-width:900px;margin:0 auto;padding:40px 24px 120px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.lead{font-size:16px;color:var(--muted);max-width:680px;margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.back{font-size:14px}
.toolbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:16px 0 12px;margin:20px 0 8px;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.filters button{font:inherit;font-size:13px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:13px;color:var(--muted);margin-top:8px}
h2.group{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:32px 0 10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:12px 0}
.note h3{font-size:16px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline}
.note h3 .id{font:600 12px var(--mono);color:var(--accent);flex:none}
.note .row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 14px;margin-top:10px;font-size:14px}
.note .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.note .v p{margin:0 0 6px}
.note .trap{background:var(--warn-soft);border-radius:6px;padding:8px 12px;font-size:14px;margin-top:10px}
.note .trap b{color:var(--warn)}
.note .where{display:flex;flex-wrap:wrap;gap:6px}
.note .where a{font:12px var(--mono);padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
.note .where a.lesson{background:var(--ok-soft);border-color:transparent}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:auto;flex:none}
.empty{color:var(--muted);text-align:center;padding:40px 0}
mark{background:var(--accent-soft);color:inherit;border-radius:2px}
@media (max-width:640px){ .note .row{grid-template-columns:1fr} .note .k{padding-top:6px} }
</style>
</head>

<pre><code>export class JwtAuthGuard implements CanActivate {

  async canActivate(ctx) {
    const token = extractToken(req);
    if (!token &amp;&amp; this.optional) return true;
    ...

// ---------- Hiển thị ----------
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const filtersEl = document.getElementById('filters');
const countEl = document.getElementById('count');
let active = 'all';

[['all', 'Tất cả'], ...Object.entries(GROUPS)].forEach(([key, label]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.dataset.key = key;
  b.setAttribute('aria-pressed', String(key === active));
  b.addEventListener('click', () => { active = key; render(); });
  filtersEl.appendChild(b);
});

const strip = (html) => html.replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' ');
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');

function card(n) {
  const where = (n.w || []).map(([label, href]) => `<a href="${href}">${label}</a>`).join('');
  const lessons = (n.l || []).map((p) => `<a class="lesson" href="${L}${p}/README.md">📘 ${p}</a>`).join('');
  return `<article class="note" id="${n.id}">
    <h3><span class="id">${n.id}</span><span>${n.title}</span><span class="tag">${GROUPS[n.g]}</span></h3>
    <div class="row">
      <div class="k">Vấn đề</div><div class="v"><p>${n.p}</p></div>
      <div class="k">Kiến thức</div><div class="v">${n.k}</div>
      <div class="k">Ở đâu</div><div class="v where">${where}${lessons}</div>
    </div>
    ${n.t ? `<div class="trap"><b>Bẫy đã gặp:</b> ${n.t}</div>` : ''}
  </article>`;
}

function render() {
  filtersEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.key === active)));
  const q = norm(qEl.value.trim());
  const shown = NOTES.filter((n) =>
    (active === 'all' || n.g === active) &&
    (!q || norm(strip(n.id + ' ' + n.title + ' ' + n.p + ' ' + n.k + ' ' + (n.t || ''))).includes(q)));
  let html = '';
  for (const g of Object.keys(GROUPS)) {
    const inGroup = shown.filter((n) => n.g === g);
    if (!inGroup.length) continue;
    html += `<h2 class="group">${GROUPS[g]}</h2>` + inGroup.map(card).join('');
  }
  listEl.innerHTML = html || '<p class="empty">Không có ghi chú khớp.</p>';
  countEl.textContent = `${shown.length}/${NOTES.length} ghi chú`;
}
qEl.addEventListener('input', render);
render();
</script>
