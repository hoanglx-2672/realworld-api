# CI: lint, format, SunLint, typecheck, unit test, build, migration, e2e và bộ API test
# chính thức của RealWorld (Hurl) cho mỗi PR và mỗi lần push lên master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  # PR: một nhóm cho mỗi PR, push mới thì bỏ run cũ.
  # master: mỗi commit một nhóm riêng. Dùng chung nhóm thì GitHub chỉ giữ một run đang
  # chờ, merge liên tiếp sẽ huỷ run ở giữa dù cancel-in-progress là false.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: realworld
          POSTGRES_PASSWORD: realworld
          POSTGRES_DB: realworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realworld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: realworld
      DB_PASSWORD: realworld
      DB_DATABASE: realworld
      DEFAULT_LOCALE: en
      # Chỉ dùng cho DB tạm của CI, không phải secret thật.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      JWT_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # cần lịch sử base để so migration

      # Các bước kiểm vệ sinh repo: chạy phía server, không trông vào máy dev.
      - name: Không commit file .env (trừ .env.example)
        run: |
          files=$(git ls-files -- ':(glob)**/.env*' ':(exclude,glob)**/.env.example')
          if [ -n "$files" ]; then echo "File env không được commit:"; echo "$files"; exit 1; fi

      - name: Không có synchronize true
        run: |
          # grep: 0 = tìm thấy (sai), 1 = không thấy (đúng), khác = grep lỗi (không coi là qua).
          rc=0
          grep -rnE "synchronize:[[:space:]]*true" src || rc=$?
          if [ "$rc" -eq 0 ]; then echo "Dùng migration thay cho synchronize: true"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "grep lỗi (mã $rc)"; exit "$rc"; fi

      - name: Không sửa/xoá migration đã có trên base
        if: github.event_name == 'pull_request'
        env:
          # Truyền qua env, không dán ${{ }} thẳng vào script (tránh chèn lệnh qua tên nhánh).
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF...HEAD" -- src/database/migrations)
          if [ -n "$changed" ]; then echo "Tạo migration MỚI thay vì sửa:"; echo "$changed"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: SunLint
        run: npm run sunlint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit test
        run: npm test

      - name: Build (tsconfig.build.json, như khi deploy)
        run: npm run build

      # Hai bước dưới chỉ chạy khi nhánh đã có schema (từ PR feat/database-schema).
      # Gọi thẳng typeorm trên dist vừa build (npm run migration:* sẽ build lại lần nữa).
      # run → revert → run: thử cả down() của migration mới nhất.
      - name: Migration (run, revert, run)
        if: hashFiles('src/database/data-source.ts') != ''
        run: |
          npx typeorm migration:run -d dist/database/data-source.js
          npx typeorm migration:revert -d dist/database/data-source.js
          npx typeorm migration:run -d dist/database/data-source.js

      - name: Migration khớp entity
        if: hashFiles('src/database/data-source.ts') != ''
        # --check: thoát lỗi nếu entity đổi mà chưa có migration; không ghi file.
        run: npx typeorm migration:generate -d dist/database/data-source.js --check src/database/migrations/CiCheck

      - name: E2E test
        if: hashFiles('test/**/*.e2e-spec.ts') != ''
        run: npm run test:e2e

      # Bộ API test chính thức của RealWorld (Hurl), chạy với app thật trên DB đã migrate.
      # Ghim commit của spec và image Hurl (theo digest) để kết quả không tự đổi theo upstream.
      # Chỉ chạy file của feature đã làm; làm thêm feature thì thêm tên file vào SPEC_FILES:
      # feed cần follow, errors_articles và favorites cần favorite, profiles và
      # errors_profiles cần profile.
      - name: RealWorld API spec (Hurl)
        env:
          # Image chính thức của Hurl 8.1.0. Không dùng gói .deb: nó đòi libxml2 theo tên cũ,
          # không cài được trên Ubuntu 26 (ubuntu-latest).
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:8.1.0@sha256:f8aed33658ba793ed53c5a5b2e57cadd9ec9322c8b56c550652c1f4cbaa241c5
          SPEC_REPO: realworld-apps/realworld
          SPEC_SHA: 25588846c314b15a5e427ffe816e6b4af7be68c7
          SPEC_FILES: >-
            auth errors_auth articles pagination tags
            comments errors_comments errors_authorization
          # Bộ spec đăng nhập nhiều lần từ cùng IP: nới giới hạn login (ISS-20) cho app chạy thử.
          LOGIN_THROTTLE_LIMIT: '1000'
        run: |
          spec="$RUNNER_TEMP/realworld-spec"
          mkdir -p "$spec"
          files=()
          for f in $SPEC_FILES; do
            curl -fsSL -o "$spec/$f.hurl" \
              "https://raw.githubusercontent.com/$SPEC_REPO/$SPEC_SHA/specs/api/hurl/$f.hurl"
            files+=("/spec/$f.hurl")
          done
          docker pull -q "$HURL_IMAGE"

          node dist/main.js > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/api/user && break
            sleep 1
          done

          rc=0
          # --network host: Hurl trong container gọi được app ở localhost:3000 của runner.
          docker run --rm --network host -v "$spec:/spec:ro" "$HURL_IMAGE" \
            --test --jobs 1 --error-format long \
            --variable host=http://localhost:3000 \
            --variable "uid=$(date +%s)$$" \
            "${files[@]}" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "--- 100 dòng cuối log của app ---"
            tail -n 100 "$RUNNER_TEMP/app.log"
          fi
          exit "$rc"
