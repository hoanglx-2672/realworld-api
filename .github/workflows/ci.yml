# CI: lint, format, SunLint, typecheck, unit test, build, migration và e2e cho mỗi PR
# và mỗi lần push lên master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  # PR: một nhóm cho mỗi PR, push mới thì bỏ run cũ.
  # master: mỗi commit một nhóm riêng. Dùng chung nhóm thì GitHub chỉ giữ một run đang
  # chờ, merge liên tiếp sẽ huỷ run ở giữa dù cancel-in-progress là false.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: realworld
          POSTGRES_PASSWORD: realworld
          POSTGRES_DB: realworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realworld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: realworld
      DB_PASSWORD: realworld
      DB_DATABASE: realworld
      DEFAULT_LOCALE: en
      # Chỉ dùng cho DB tạm của CI, không phải secret thật.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      JWT_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # cần lịch sử base để so migration

      # Các kiểm vệ sinh của kiem.mjs: phải chạy phía server, không trông vào máy dev.
      - name: Không commit file .env (trừ .env.example)
        run: |
          files=$(git ls-files -- ':(glob)**/.env*' ':(exclude,glob)**/.env.example')
          if [ -n "$files" ]; then echo "File env không được commit:"; echo "$files"; exit 1; fi

      - name: Không có synchronize true
        run: |
          # grep: 0 = tìm thấy (sai), 1 = không thấy (đúng), khác = grep lỗi (không coi là qua).
          rc=0
          grep -rnE "synchronize:[[:space:]]*true" src || rc=$?
          if [ "$rc" -eq 0 ]; then echo "Dùng migration thay cho synchronize: true"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "grep lỗi (mã $rc)"; exit "$rc"; fi

      - name: Không sửa/xoá migration đã có trên base
        if: github.event_name == 'pull_request'
        env:
          # Truyền qua env, không dán ${{ }} thẳng vào script (tránh chèn lệnh qua tên nhánh).
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF...HEAD" -- src/database/migrations)
          if [ -n "$changed" ]; then echo "Tạo migration MỚI thay vì sửa:"; echo "$changed"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: SunLint
        run: npm run sunlint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit test
        run: npm test

      - name: Build (tsconfig.build.json, như khi deploy)
        run: npm run build

      # Hai bước dưới chỉ chạy khi nhánh đã có schema (từ PR feat/database-schema).
      # Gọi thẳng typeorm trên dist vừa build (npm run migration:* sẽ build lại lần nữa).
      # run → revert → run: thử cả down() của migration mới nhất.
      - name: Migration (run, revert, run)
        if: hashFiles('src/database/data-source.ts') != ''
        run: |
          npx typeorm migration:run -d dist/database/data-source.js
          npx typeorm migration:revert -d dist/database/data-source.js
          npx typeorm migration:run -d dist/database/data-source.js

      - name: Migration khớp entity
        if: hashFiles('src/database/data-source.ts') != ''
        # --check: thoát lỗi nếu entity đổi mà chưa có migration; không ghi file.
        run: npx typeorm migration:generate -d dist/database/data-source.js --check src/database/migrations/CiCheck

      - name: E2E test
        if: hashFiles('test/**/*.e2e-spec.ts') != ''
        run: npm run test:e2e
